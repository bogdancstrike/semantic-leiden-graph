# Upstream re-resolution: Docker's embedded DNS; lets nginx start before the API is up
# and follows the API container across restarts (IP changes).
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # CSV uploads: the API limit is 1 GiB (UPLOAD_MAX_BYTES); allow multipart overhead.
    # nginx's default (1 MiB) would reject almost every real import with 413 before it
    # reaches the API. Raise both together.
    client_max_body_size 1100m;
    client_body_buffer_size 1m;
    # Between two reads of the client body, not the whole upload: a slow link is fine.
    client_body_timeout 300s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # Security headers. antd injects <style> tags at runtime (CSS-in-JS), hence
    # style-src 'unsafe-inline'; scripts stay strictly same-origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        set $api_upstream http://app:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Stream uploads straight to the API (which enforces its own byte limit) instead
        # of buffering a gigabyte to nginx's disk first; the browser progress bar stays honest.
        proxy_request_buffering off;
        # A 1 GiB upload answers only once the API has the whole file on disk.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Content-hashed bundles: cache forever.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA entry: always revalidate so a deploy is picked up immediately.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
